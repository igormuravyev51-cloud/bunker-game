name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev wget
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Accept Android SDK licenses
        run: |
          # Используем уже установленный sdkmanager
          SDKMANAGER=$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -n 1)
          echo "Found sdkmanager at: $SDKMANAGER"
          yes | $SDKMANAGER --licenses || true
          yes | $SDKMANAGER "build-tools;33.0.2" "platforms;android-33" || true

      - name: Build with Buildozer
        run: |
          # Указываем buildozer путь к уже установленному SDK
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$PATH:$HOME/.local/bin

          # Проверяем, что buildozer видит SDK
          ls -la $ANDROID_HOME/ || true
          ls -la $ANDROID_HOME/build-tools/ || true

          # Собираем
          yes | buildozer android debug 2>&1 | tee build.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn

      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
